[workspace]
members = ["crates/cli", "crates/core", "crates/plugin", "crates/protocol"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.10"
log = "0.4"
rustyscript = { git = "https://github.com/rscarson/rustyscript", tag = "v0.12.3", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.219", features = ["derive"] }
toml = "0.8"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
serde_json = "=1.0.140"
